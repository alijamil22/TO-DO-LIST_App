{% extends "todo_app/base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0">
            <div class="card-body py-5">
                <h1 class="display-1 fw-bold text-dark">404</h1>
                <h4 class="text-muted mb-3">Oops! Page not found</h4>
                <p class="text-muted">The task or page you are looking for doesn't exist or you don't have permission to access it.</p>
                <a href="{% url 'todo_list' %}" class="btn btn-dark mt-3">⬅ Back to My Tasks</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
