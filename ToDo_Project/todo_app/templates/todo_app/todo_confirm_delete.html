{% extends "todo_app/base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">🗑️ Delete Task</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">Are you sure you want to delete:</p>
                <h5 class="fw-bold text-danger">"{{ object.title }}"</h5>
                <p class="text-muted small">This action cannot be undone.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-3">
                        <a href="{% url 'todo_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
